<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <style>
    .brand-green { fill: #047857; stroke: #047857; }
    .brand-yellow { fill: #eab308; stroke: #eab308; }
    .text-title { font-family: 'Outfit', 'Inter', system-ui, sans-serif; font-weight: 800; font-size: 110px; fill: #047857; }
    .text-subtitle { font-family: 'Inter', system-ui, sans-serif; font-weight: 700; font-size: 26px; fill: #ffffff; }
  </style>

  <!-- Background Canvas -->
  <rect width="800" height="800" fill="#ffffff"/>

  <!-- Title: MiRice -->
  <g transform="translate(140, 190)">
    <!-- M -->
    <path d="M 0 110 V 10 L 40 70 L 80 10 V 110" fill="none" stroke="#047857" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- i (dot yellow) -->
    <path d="M 115 110 V 50" fill="none" stroke="#047857" stroke-width="24" stroke-linecap="round"/>
    <circle cx="115" cy="22" r="14" fill="#eab308"/>
    <!-- R -->
    <path d="M 160 110 V 10 H 205 C 230 10 245 25 245 45 C 245 65 230 75 205 75 H 160 M 205 75 L 245 110" fill="none" stroke="#047857" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- i -->
    <path d="M 280 110 V 50" fill="none" stroke="#047857" stroke-width="24" stroke-linecap="round"/>
    <circle cx="280" cy="22" r="14" fill="#047857"/>
    <!-- c -->
    <path d="M 365 45 C 330 45 315 65 315 80 C 315 100 330 115 365 115 C 385 115 400 105 405 95" fill="none" stroke="#047857" stroke-width="24" stroke-linecap="round"/>
    <!-- e -->
    <path d="M 490 85 H 430 C 430 60 445 45 465 45 C 490 45 495 65 495 70 M 430 90 C 435 110 455 115 470 115 C 488 115 498 105 500 100" fill="none" stroke="#047857" stroke-width="24" stroke-linecap="round"/>
  </g>

  <!-- Subtitle Pill Badge -->
  <rect x="70" y="240" width="660" height="54" rx="27" fill="#047857"/>
  <text x="400" y="276" text-anchor="middle" class="text-subtitle">Plataforma de Convivencia Educativa</text>

  <!-- Connecting Lines V-shape -->
  <path d="M 190 350 L 310 470 L 400 470 L 490 470 L 610 350" fill="none" stroke="#047857" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 190 350 V 480" fill="none" stroke="#047857" stroke-width="20" stroke-linecap="round"/>
  <path d="M 610 350 V 480" fill="none" stroke="#eab308" stroke-width="20" stroke-linecap="round"/>

  <!-- Left: Green Book -->
  <g transform="translate(90, 480)">
    <path d="M 10 20 Q 100 0 100 30 Q 100 0 190 20 V 160 Q 100 140 100 170 Q 100 140 10 160 Z" fill="none" stroke="#047857" stroke-width="18" stroke-linejoin="round"/>
    <line x1="100" y1="30" x2="100" y2="170" stroke="#047857" stroke-width="18"/>
  </g>

  <!-- Center: Green Shield -->
  <g transform="translate(300, 480)">
    <path d="M 10 20 L 100 0 L 190 20 V 90 C 190 150 100 200 100 200 C 100 200 10 150 10 90 Z" fill="none" stroke="#047857" stroke-width="18" stroke-linejoin="round"/>
  </g>

  <!-- Right: Yellow Speech Bubble -->
  <g transform="translate(510, 480)">
    <circle cx="100" cy="90" r="85" fill="none" stroke="#eab308" stroke-width="18"/>
    <path d="M 35 145 L 10 190 L 70 170 Z" fill="#eab308"/>
  </g>

  <!-- GIGANTE DE TARAPACÁ HEAD CONTOUR (With Handshake Symbol inside) -->
  <g transform="translate(325, 340)">
    <!-- Top 4 Spikes -->
    <path d="M 30 0 V -35 H 42 V 0 M 54 0 V -45 H 66 V 0 M 78 0 V -45 H 90 V 0 M 102 0 V -35 H 114 V 0" fill="none" stroke="#047857" stroke-width="6" stroke-linejoin="round"/>
    <!-- Head Box -->
    <rect x="25" y="0" width="95" height="75" fill="#ffffff" stroke="#047857" stroke-width="7" rx="4"/>
    <!-- Left Side Bars (3 bars) -->
    <path d="M 0 15 H 25 M 0 35 H 25 M 0 55 H 25" stroke="#047857" stroke-width="6"/>
    <!-- Right Side Bars (3 bars) -->
    <path d="M 120 15 H 145 M 120 35 H 145 M 120 55 H 145" stroke="#047857" stroke-width="6"/>
    <!-- Handshake / Manos Unidas Symbol inside Box -->
    <path d="M 45 42 L 57 30 L 70 42 L 85 28 L 100 42" fill="none" stroke="#047857" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 50 48 L 62 36 M 60 52 L 72 40 M 70 55 L 82 43" stroke="#047857" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>
